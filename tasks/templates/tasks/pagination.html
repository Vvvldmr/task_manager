{% if page_obj.paginator.num_pages > 1 %}
<p>
    {% if page_obj.has_previous %}
        <a href="?{{ querystring }}&page={{ page_obj.previous_page_number }}">« Предыдущая</a>
    {% endif %}

    Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}

    {% if page_obj.has_next %}
        <a href="?{{ querystring }}&page={{ page_obj.next_page_number }}">Следующая »</a>
    {% endif %}
</p>
{% endif %}
