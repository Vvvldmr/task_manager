{% extends "base.html" %}

{% block title %}
Удалить задачу
{% endblock %}

{% block content %}

<h2>Удалить задачу?</h2>

<p>Вы уверены, что хотите удалить задачу «{{ task.name }}»? Это действие необратимо, вместе с задачей будут удалены все комментарии к ней.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'task_detail' task.pk %}">Отмена</a>
</form>

{% endblock %}
